<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/landing.css" />
    <script src="./js/script.js"></script>
    <title>Landing Page</title>
  </head>
  <body>
    <h1>Welcome!</h1>
    <p>This is a static page 🛑</p>
    <h2>Here's our 🍪 Cookie Shop!</h2>

    <form action="/my-handling-form-page" method="post">
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="user_name" />
      </p>
      <p>
        <label for="mail">Email:</label>
        <input
          type="email"
          id="mail"
          name="user_email"
          placeholder="john.doe@mail.com"
        />
      </p>
      <p>
        <label for="msg">Message:</label>
        <textarea
          name="user_message"
          id="msg"
          placeholder="Write your message here..."
        ></textarea>
      </p>
      <p class="button"><button type="submit">Send your message</button></p>
    </form>

    <form>
      <fieldset>
        <legend>Please choose the cookie size</legend>
        <p>
          <input type="radio" name="size" id="size_1" value="small" />
          <label for="size_1">Small</label>
        </p>
        <p>
          <input type="radio" name="size" id="size_2" value="medium" />
          <label for="size_2">Medium</label>
        </p>
        <p>
          <input type="radio" name="size" id="size_3" value="large" />
          <label for="size_3">Large</label>
        </p>
        <button>Submit</button>
      </fieldset>
    </form>

    <form action="">
      <h1>Payment Form</h1>
      <p>Please complete all required (*) fields.</p>
      <section>
        <h2>Contact Information</h2>
        <fieldset>
          <legend>Title</legend>
          <ul>
            <li>
              <label for="title_1">
                <input
                  type="radio"
                  name="title"
                  id="title_1"
                  value="A"
                  required
                />Ace
              </label>
            </li>
            <li>
              <label for="title_2">
                <input type="radio" name="title" id="title_2" value="K" />
                King
              </label>
            </li>
            <li>
              <label for="title_3">
                <input type="radio" name="title" id="title_3" value="Queen" />
                Queen
              </label>
            </li>
          </ul>
        </fieldset>
        <p>
          <label for="name">Name*:</label>
          <input type="text" name="username" id="name" required />
        </p>
        <p>
          <label for="email">Email*:</label>
          <input type="email" id="mail" name="user-mail" required />
        </p>
        <p>
          <label for="pwd">Password*:</label>
          <input type="password" id="pwd" name="password" required />
        </p>
      </section>
      <section>
        <h2>Payment Information</h2>
        <p>
          <label for="card">
            <span>Card type:</span>
          </label>
          <select name="user-card" id="card">
            <option value="visa">Visa</option>
            <option value="mc">Mastercard</option>
            <option value="amex">American Express</option>
          </select>
        </p>
        <p>
          <label for="number">Card number*:</label>
          <input type="tel" id="number" name="card-number" required />
        </p>
        <p>
          <label for="expiration">Expiration date*:</label>
          <input
            type="text"
            id="expiration"
            name="expiration"
            required
            placeholder="MM/YY"
            pattern="^(0[1-9]1[0-2])\/([0-9]{2})$"
          />
        </p>
      </section>
      <section>
        <p>
          <button type="submit">Validate the payment</button>
        </p>
      </section>
    </form>
  </body>
</html>
